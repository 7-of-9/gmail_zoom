<!doctype html>
<!-- Chrome Web Store marquee, 1400x560. Hash: {"src": "<capture>"}. Used by tools/media.mjs. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #fff; position: relative;
    background: radial-gradient(700px 500px at 100% 100%, #a855f7 0%, transparent 70%), linear-gradient(135deg, #3b0764 0%, #4c1d95 45%, #6b21a8 100%); }
  .left { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .name { display: flex; align-items: center; gap: 20px; }
  .name img { width: 96px; height: 96px; filter: drop-shadow(0 10px 20px rgba(0,0,0,.3)); }
  h1 { margin: 0; font-size: 54px; line-height: 1; font-weight: 800; letter-spacing: -1px; }
  h1 span { display: block; font-size: 24px; font-weight: 600; color: #e9d5ff; margin-top: 8px; letter-spacing: 0; }
  p { margin: 30px 0 0; font-size: 28px; line-height: 1.3; color: #f3e8ff; font-weight: 500; }
  ul { list-style: none; padding: 0; margin: 26px 0 0; display: flex; flex-wrap: wrap; gap: 10px; }
  li { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 16px; font-size: 17px; font-weight: 600; }
  .shot { position: absolute; left: 720px; top: 70px; width: 800px; height: 500px; border-radius: 16px; background-size: 800px 500px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.2); transform: rotate(-2deg); }
</style>
<div class="left">
  <div class="name"><img src="../../icons/icon.svg" alt=""><h1>Pane Zoom<span>for Gmail</span></h1></div>
  <p>Zoom the email, not the whole of Gmail.</p>
  <ul><li>Per-sender zoom</li><li>⌘⇧+ / ⌘⇧−</li><li>Syncs across machines</li><li>No login</li></ul>
</div>
<div class="shot" id="shot"></div>
<script>
  const cfg = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
  if (cfg.src) document.getElementById('shot').style.backgroundImage = `url("${cfg.src}")`;
  document.title = 'ready';
</script>
