<!doctype html>
<!-- Chrome Web Store small promo tile, 440x280. Used by tools/media.mjs. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: radial-gradient(380px 260px at 90% 110%, #a855f7 0%, transparent 70%), linear-gradient(140deg, #4c1d95 0%, #6b21a8 60%, #7e22ce 100%);
    color: #fff; display: flex; align-items: center; gap: 22px; padding: 0 30px; box-sizing: border-box; }
  img { width: 112px; height: 112px; flex: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,.3)); }
  h1 { margin: 0; font-size: 38px; line-height: 1.02; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { display: block; font-size: 19px; font-weight: 600; color: #e9d5ff; margin-top: 6px; letter-spacing: 0; }
  p { margin: 14px 0 0; font-size: 15px; line-height: 1.35; color: #f3e8ff; }
  .keys { display: inline-flex; gap: 4px; margin-top: 12px; }
  kbd { font: 700 13px/1 inherit; background: #fff; color: #4c1d95; border-radius: 5px; padding: 5px 7px; box-shadow: inset 0 -2px 0 #d8b4fe; }
</style>
<img src="../../icons/icon.svg" alt="">
<div>
  <h1>Pane Zoom<span>for Gmail</span></h1>
  <p>Zoom the email,<br>not the whole inbox.</p>
  <div class="keys"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>+</kbd></div>
</div>
<script>document.title = 'ready';</script>
